<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👹 غول</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#screen {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle, #182000 0%, #050505 45%, #000 100%);
}

/* تصویر غول */
#monster {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter:
        brightness(0.55)
        contrast(1.5)
        saturate(1.4)
        drop-shadow(0 0 35px #7cff00);

    animation: breathing 2.5s infinite ease-in-out;
}

/* افکت نفس کشیدن */
@keyframes breathing {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.035);
    }
}

/* تاریکی روی تصویر */
.dark {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    pointer-events: none;
}

/* نوشته پایین */
#warning {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;

    color: #ff1111;
    font-size: clamp(35px, 6vw, 80px);
    font-weight: 900;

    text-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 35px #800000;

    animation: textPulse 1s infinite;
}

@keyframes textPulse {
    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }
}

/* خون */
#blood {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(100,0,0,.15) 50%,
            rgba(120,0,0,.75) 100%
        );
}

/* صفحه مرگ */
#dead {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    background: rgba(0,0,0,.9);

    opacity: 0;
    pointer-events: none;
}

#dead h1 {
    margin: 0;
    color: #ff0000;

    font-size: clamp(70px, 15vw, 190px);

    font-weight: 900;

    text-shadow:
        0 0 10px red,
        0 0 40px red,
        0 0 80px darkred;

    transform: scale(0.5);
}

#dead p {
    color: white;
    font-size: 25px;
}

/* شروع */
#start {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #000;
}

#start button {
    padding: 18px 45px;

    border: 2px solid #55ff00;
    border-radius: 12px;

    background: #071000;
    color: #7cff00;

    font-size: 25px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 0 25px #55ff00;
}

#start button:hover {
    background: #152800;
    transform: scale(1.05);
}
</style>
</head>

<body>

<div id="start">
    <button onclick="startScare()">👹 ورود</button>
</div>

<div id="screen">

    <!-- عکس غول -->
    <img id="MONSTER" src="monster.png">

    <div class="dark"></div>

    <div id="warning">
        تو امشب میمیری
    </div>

    <div id="blood"></div>

    <div id="dead">
        <h1>YOU DIED</h1>
        <p>هیچ راه فراری نیست...</p>
    </div>

</div>

<script>

let audioContext;

function scarySound() {

    audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

    const now = audioContext.currentTime;

    // صدای بم و ترسناک
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(25, now + 2.5);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.5, now + 0.2);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 3);

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(now + 3);

    // صدای جیغ کوتاه
    setTimeout(() => {

        const scream = audioContext.createOscillator();
        const screamGain = audioContext.createGain();

        scream.type = "square";

        scream.frequency.setValueAtTime(500, audioContext.currentTime);
        scream.frequency.exponentialRampToValueAtTime(
            100,
            audioContext.currentTime + 0.8
        );

        screamGain.gain.setValueAtTime(
            0.25,
            audioContext.currentTime
        );

        screamGain.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.8
        );

        scream.connect(screamGain);
        screamGain.connect(audioContext.destination);

        scream.start();
        scream.stop(audioContext.currentTime + 0.8);

    }, 400);
}


function startScare() {

    document.getElementById("start").style.display = "none";

    // فول‌اسکرین
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }

    scarySound();

    // چند ثانیه بعد افکت مرگ
    setTimeout(() => {

        const blood = document.getElementById("blood");

        blood.style.opacity = "1";

        blood.animate(
            [
                { opacity: 0 },
                { opacity: 1 },
                { opacity: 0.6 }
            ],
            {
                duration: 900,
                iterations: 1
            }
        );

    }, 2500);


    // صفحه YOU DIED HAHAHAHAHHA
    setTimeout(() => {

        const dead = document.getElementById("dead");

        dead.style.opacity = "1";

        const title = dead.querySelector("h1");

        title.animate(
            [
                {
                    transform: "scale(0.2)",
                    opacity: 0
                },
                {
                    transform: "scale(1.15)",
                    opacity: 1
                },
                {
                    transform: "scale(1)",
                    opacity: 1
                }
            ],
            {
                duration: 800,
                easing: "ease-out"
            }
        );

    }, 4500);

}

</script>

</body>
</html>
